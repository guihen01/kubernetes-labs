apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-app
  template:
    metadata:
      labels:
        app: cpu-app
    spec:
      containers:
      - name: cpu-app
        image: vish/stress
        args:
        - "-cpus"
        - "1"
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"

